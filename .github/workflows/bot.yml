name: signal-bot
on:
  push:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signal-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - run: python signal_bot.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent_signals.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
